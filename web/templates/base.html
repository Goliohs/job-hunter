<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Hunter Bot{% endblock %}</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .score-badge { @apply px-2 py-1 rounded text-xs font-mono font-bold; }
        .score-90 { @apply bg-green-100 text-green-800; }
        .score-80 { @apply bg-green-100 text-green-800; }
        .score-70 { @apply bg-yellow-100 text-yellow-800; }
        .score-60 { @apply bg-yellow-100 text-yellow-800; }
        .score-0 { @apply bg-gray-100 text-gray-600; }
        .status-badge { @apply px-2 py-1 rounded text-xs font-medium; }
        .status-new { @apply bg-blue-100 text-blue-800; }
        .status-viewed { @apply bg-indigo-100 text-indigo-800; }
        .status-applied { @apply bg-purple-100 text-purple-800; }
        .status-interviewing { @apply bg-orange-100 text-orange-800; }
        .status-rejected { @apply bg-red-100 text-red-800; }
        .status-offer { @apply bg-green-100 text-green-800; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-2">
                        <svg class="h-8 w-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                        <span class="text-xl font-bold text-gray-900">Job Hunter</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/jobs" class="text-sm font-medium text-gray-700 hover:text-blue-600">Ver Jobs</a>
                    <a href="/jobs?status=new&score_min=60" class="text-sm font-medium text-blue-600 hover:text-blue-800">Matches (≥60)</a>
                    <a href="/jobs?status=new&score_min=80" class="text-sm font-medium text-green-600 hover:text-green-800">High Matches (≥80)</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Quick Apply Modal -->
    <div id="quick-apply-modal" class="fixed inset-0 z-50 overflow-y-auto hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full" role="document" aria-labelledby="modal-title" aria-modal="true">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:p-12" id="quick-apply-modal">
                    <!-- Modal content will be loaded here via HTMX -->
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-gray-500">
            Job Hunter Bot — <a href="https://github.com" class="text-blue-600 hover:underline" target="_blank">GitHub</a>
        </div>
    </footer>
</body>
</html>
